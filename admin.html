<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PrimeHub Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .box {
      background: #15151c;
      border: 1px solid #292936;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border-radius: 9px;
      border: 1px solid #33333f;
      background: #0d0d12;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
      margin: 4px;
    }

    button:hover {
      opacity: .85;
    }

    .danger {
      background: #d33;
      color: white;
    }

    .secondary {
      background: #292936;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .item {
      background: #0d0d12;
      border: 1px solid #292936;
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #20202a;
      margin: 10px 0;
    }

    .logout {
      float: right;
    }

    small {
      color: #aaa;
    }

    @media(max-width:600px) {
      .wrap {
        padding: 15px;
      }

      .logout {
        float: none;
        margin-bottom: 15px;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- LOGIN -->
  <section id="loginBox" class="box">

    <h1>PrimeHub Admin</h1>
    <p><small>Login to manage your website.</small></p>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginBtn">Login</button>

    <div id="loginStatus" class="status"></div>

  </section>


  <!-- ADMIN -->
  <section id="adminBox" class="hidden">

    <button id="logoutBtn" class="secondary logout">
      Logout
    </button>

    <h1>PrimeHub Admin Panel</h1>

    <div id="saveStatus" class="status">
      Ready.
    </div>


    <!-- ABOUT -->
    <div class="box">

      <h2>About</h2>

      <textarea
        id="about"
        placeholder="Write your About section..."
      ></textarea>

      <button id="saveAboutBtn">
        Save About
      </button>

    </div>


    <!-- SERVICES -->
    <div class="box">

      <h2>Services</h2>

      <input
        id="serviceTitle"
        placeholder="Service title"
      >

      <textarea
        id="serviceText"
        placeholder="Service description"
      ></textarea>

      <button id="addServiceBtn">
        Add Service
      </button>

      <div id="servicesList"></div>

    </div>


    <!-- CONTENT -->
    <div class="box">

      <h2>Content</h2>

      <input
        id="contentTitle"
        placeholder="Content title"
      >

      <textarea
        id="contentText"
        placeholder="Content description"
      ></textarea>

      <button id="addContentBtn">
        Add Content
      </button>

      <div id="contentList"></div>

    </div>


    <!-- CONTACT -->
    <div class="box">

      <h2>Contact</h2>

      <input
        id="contactEmail"
        type="email"
        placeholder="Email"
      >

      <input
        id="contactInstagram"
        placeholder="Instagram"
      >

      <input
        id="contactPhone"
        placeholder="Phone"
      >

      <button id="saveContactBtn">
        Save Contact
      </button>

    </div>


    <!-- MEDIA -->
    <div class="box">

      <h2>Upload Media</h2>

      <p>
        <small>
          Upload photos, videos or PDFs.
        </small>
      </p>

      <input
        id="mediaTitle"
        placeholder="File title"
      >

      <textarea
        id="mediaDescription"
        placeholder="File description"
      ></textarea>

      <input
        id="mediaFile"
        type="file"
        accept="image/*,video/*,.pdf"
      >

      <button id="uploadBtn">
        Upload File
      </button>

      <div id="uploadStatus" class="status"></div>

      <div id="mediaList"></div>

    </div>

  </section>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBCx_8R-fGh9Ci4M-0Fk57dQnRfXe74YSY",

  authDomain:
    "primehub-12dde.firebaseapp.com",

  projectId:
    "primehub-12dde",

  storageBucket:
    "primehub-12dde.firebasestorage.app",

  messagingSenderId:
    "1081645394839",

  appId:
    "1:1081645394839:web:796cc1c3de6d1ce201b2d2",

  measurementId:
    "G-878ZB4S1LP"
};


/* =========================================
   CLOUDINARY
========================================= */

const CLOUD_NAME = "wmdqvk3v";
const UPLOAD_PRESET = "primehub";


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
  "7QhHlG0ydFcpFBXfs6w8fGJRK322";


/* =========================================
   INITIALIZE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================
   FIREBASE DATA
========================================= */

const dataRef =
  doc(db, "siteData", "main");


const defaultData = {

  about:
    "Welcome to PrimeHub — my personal and business digital space.",

  services: [],

  content: [],

  contact: {
    email: "",
    instagram: "",
    phone: ""
  },

  media: []

};


let siteData = {};


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginStatus =
  document.getElementById("loginStatus");

const logoutBtn =
  document.getElementById("logoutBtn");

const saveStatus =
  document.getElementById("saveStatus");


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener("click", async () => {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if (!email || !password) {

    loginStatus.textContent =
      "Please enter email and password.";

    return;
  }

  loginStatus.textContent =
    "Logging in...";

  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      loginStatus.textContent =
        "This account is not authorized.";

      return;
    }

    loginStatus.textContent =
      "Login successful.";

  } catch (error) {

    console.error(error);

    loginStatus.textContent =
      "Login failed: " + error.message;
  }

});


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(auth, async (user) => {

  if (user && user.uid === ADMIN_UID) {

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    await loadData();

  } else {

    loginBox.classList.remove("hidden");

    adminBox.classList.add("hidden");
  }

});


/* =========================================
   LOAD FIRESTORE
========================================= */

async function loadData() {

  try {

    const snapshot =
      await getDoc(dataRef);

    if (snapshot.exists()) {

      siteData = {
        ...defaultData,
        ...snapshot.data()
      };

    } else {

      siteData = {
        ...defaultData
      };

      await saveData();
    }

    renderAll();

  } catch (error) {

    console.error(error);

    saveStatus.textContent =
      "Failed to load Firebase data.";
  }

}


/* =========================================
   SAVE FIRESTORE
========================================= */

async function saveData() {

  try {

    await setDoc(
      dataRef,
      siteData,
      { merge: true }
    );

    saveStatus.textContent =
      "✓ Saved successfully.";

  } catch (error) {

    console.error(error);

    saveStatus.textContent =
      "Save failed: " + error.message;
  }

}


/* =========================================
   ABOUT
========================================= */

document
  .getElementById("saveAboutBtn")
  .addEventListener("click", async () => {

    siteData.about =
      document.getElementById("about").value.trim();

    await saveData();
  });


/* =========================================
   ADD SERVICE
========================================= */

document
  .getElementById("addServiceBtn")
  .addEventListener("click", async () => {

    const title =
      document.getElementById("serviceTitle")
        .value.trim();

    const text =
      document.getElementById("serviceText")
        .value.trim();

    if (!title) {

      alert("Enter service title.");

      return;
    }

    if (!Array.isArray(siteData.services)) {
      siteData.services = [];
    }

    siteData.services.push({
      title,
      text
    });

    document.getElementById("serviceTitle").value = "";
    document.getElementById("serviceText").value = "";

    await saveData();

    renderServices();
  });


/* =========================================
   ADD CONTENT
========================================= */

document
  .getElementById("addContentBtn")
  .addEventListener("click", async () => {

    const title =
      document.getElementById("contentTitle")
        .value.trim();

    const text =
      document.getElementById("contentText")
        .value.trim();

    if (!title) {

      alert("Enter content title.");

      return;
    }

    if (!Array.isArray(siteData.content)) {
      siteData.content = [];
    }

    siteData.content.push({
      title,
      text
    });

    document.getElementById("contentTitle").value = "";
    document.getElementById("contentText").value = "";

    await saveData();

    renderContent();
  });


/* =========================================
   CONTACT
========================================= */

document
  .getElementById("saveContactBtn")
  .addEventListener("click", async () => {

    siteData.contact = {

      email:
        document.getElementById("contactEmail")
          .value.trim(),

      instagram:
        document.getElementById("contactInstagram")
          .value.trim(),

      phone:
        document.getElementById("contactPhone")
          .value.trim()
    };

    await saveData();
  });


/* =========================================
   DELETE SERVICE
========================================= */

async function deleteService(index) {

  siteData.services.splice(index, 1);

  await saveData();

  renderServices();
}


/* =========================================
   DELETE CONTENT
========================================= */

async function deleteContent(index) {

  siteData.content.splice(index, 1);

  await saveData();

  renderContent();
}


/* =========================================
   RENDER SERVICES
========================================= */

function renderServices() {

  const list =
    document.getElementById("servicesList");

  list.innerHTML = "";

  if (!siteData.services.length) {

    list.innerHTML =
      "<small>No services added.</small>";

    return;
  }

  siteData.services.forEach((item, index) => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <h3>${escapeHtml(item.title)}</h3>
      <p>${escapeHtml(item.text)}</p>
      <button class="danger">Delete</button>
    `;

    div
      .querySelector("button")
      .addEventListener(
        "click",
        () => deleteService(index)
      );

    list.appendChild(div);

  });

}


/* =========================================
   RENDER CONTENT
========================================= */

function renderContent() {

  const list =
    document.getElementById("contentList");

  list.innerHTML = "";

  if (!siteData.content.length) {

    list.innerHTML =
      "<small>No content added.</small>";

    return;
  }

  siteData.content.forEach((item, index) => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <h3>${escapeHtml(item.title)}</h3>
      <p>${escapeHtml(item.text)}</p>
      <button class="danger">Delete</button>
    `;

    div
      .querySelector("button")
      .addEventListener(
        "click",
        () => deleteContent(index)
      );

    list.appendChild(div);

  });

}


/* =========================================
   RENDER MEDIA
========================================= */

function renderMedia() {

  const list =
    document.getElementById("mediaList");

  list.innerHTML = "";

  if (!siteData.media || !siteData.media.length) {

    list.innerHTML =
      "<small>No uploaded files.</small>";

    return;
  }

  siteData.media.forEach((item) => {

    const div =
      document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <h3>${escapeHtml(item.title)}</h3>

      <p>
        ${escapeHtml(item.description || "")}
      </p>

      <a
        href="${item.url}"
        target="_blank"
        rel="noopener"
      >
        Open File
      </a>
    `;

    list.appendChild(div);

  });

}


/* =========================================
   RENDER ALL
========================================= */

function renderAll() {

  document.getElementById("about").value =
    siteData.about || "";

  document.getElementById("contactEmail").value =
    siteData.contact?.email || "";

  document.getElementById("contactInstagram").value =
    siteData.contact?.instagram || "";

  document.getElementById("contactPhone").value =
    siteData.contact?.phone || "";

  if (!Array.isArray(siteData.services))
    siteData.services = [];

  if (!Array.isArray(siteData.content))
    siteData.content = [];

  if (!Array.isArray(siteData.media))
    siteData.media = [];

  renderServices();

  renderContent();

  renderMedia();
}


/* =========================================
   CLOUDINARY UPLOAD
========================================= */

document
  .getElementById("uploadBtn")
  .addEventListener("click", async () => {

    const file =
      document.getElementById("mediaFile").files[0];

    const title =
      document.getElementById("mediaTitle")
        .value.trim();

    const description =
      document.getElementById("mediaDescription")
        .value.trim();

    const uploadStatus =
      document.getElementById("uploadStatus");


    if (!file) {

      uploadStatus.textContent =
        "Please select a file.";

      return;
    }


    if (!title) {

      uploadStatus.textContent =
        "Please enter a file title.";

      return;
    }


    uploadStatus.textContent =
      "Uploading...";


    try {

      const formData =
        new FormData();

      formData.append(
        "file",
        file
      );

      formData.append(
        "upload_preset",
        UPLOAD_PRESET
      );


      const response =
        await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
          {
            method: "POST",
            body: formData
          }
        );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error?.message ||
          "Cloudinary upload failed."
        );
      }


      const mediaItem = {

        title,

        description,

        url:
          result.secure_url,

        publicId:
          result.public_id,

        resourceType:
          result.resource_type,

        createdAt:
          new Date().toISOString()
      };


      if (!Array.isArray(siteData.media)) {
        siteData.media = [];
      }


      siteData.media.push(mediaItem);


      await saveData();


      document.getElementById("mediaTitle").value = "";

      document.getElementById("mediaDescription").value = "";

      document.getElementById("mediaFile").value = "";


      uploadStatus.textContent =
        "✓ Upload successful.";


      renderMedia();


    } catch (error) {

      console.error(error);

      uploadStatus.textContent =
        "Upload failed: " + error.message;
    }

  });


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function (char) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"

        }[char];

      }
    );
}

</script>

</body>
</html>
