<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeHub Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  background:#0b0b0d;
  color:#f5f5f5;
}

.container{
  width:92%;
  max-width:1050px;
  margin:auto;
}

header{
  padding:25px 0;
  border-bottom:1px solid #29292d;
  margin-bottom:25px;
}

header h1{
  color:#d8b56a;
  margin-bottom:5px;
}

header p{color:#888}

.card{
  background:#151518;
  border:1px solid #29292d;
  border-radius:16px;
  padding:25px;
  margin-bottom:20px;
}

h2{
  color:#d8b56a;
  margin-bottom:18px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#ccc;
}

input,textarea{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #333;
  background:#0d0d0f;
  color:#fff;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,textarea:focus{
  border-color:#d8b56a;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  margin-top:12px;
}

.primary{
  background:#d8b56a;
  color:#111;
}

.secondary{
  background:#29292d;
  color:#fff;
}

.danger{
  background:#b33a3a;
  color:#fff;
}

.hidden{display:none!important}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:8px;
  background:#202024;
  color:#ccc;
}

.item{
  background:#0e0e10;
  border:1px solid #29292d;
  border-radius:10px;
  padding:15px;
  margin-top:12px;
}

.item-title{
  color:#d8b56a;
  font-weight:bold;
  margin-bottom:7px;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:7px;
}

.progress-box{
  margin-top:15px;
}

.progress-item{
  margin-top:10px;
  padding:12px;
  background:#0d0d0f;
  border:1px solid #29292d;
  border-radius:9px;
}

.progress-name{
  font-size:14px;
  margin-bottom:7px;
}

.progress-bar{
  height:8px;
  background:#29292d;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:#d8b56a;
  transition:.2s;
}

.progress-text{
  font-size:12px;
  color:#888;
  margin-top:5px;
}

.media-preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  margin-top:10px;
  border-radius:8px;
}

.logout{
  float:right;
}

@media(max-width:700px){
  .logout{
    float:none;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
<button id="logoutBtn" class="secondary logout hidden">Logout</button>
<h1>PrimeHub Admin</h1>
<p>Manage your website content and media.</p>
</header>

<!-- LOGIN -->

<section id="loginSection" class="card">

<h2>Admin Login</h2>

<label>Email</label>
<input id="loginEmail" type="email" placeholder="Admin email">

<label>Password</label>
<input id="loginPassword" type="password" placeholder="Password">

<button id="loginBtn" class="primary">Login</button>

<div id="loginStatus" class="status">
Please login.
</div>

</section>


<main id="adminPanel" class="hidden">


<!-- ABOUT -->

<section class="card">

<h2>About</h2>

<label>About Title</label>
<input id="aboutTitle" placeholder="About Me">

<label>About Text</label>
<textarea id="aboutText" placeholder="Write about yourself..."></textarea>

<button id="saveAboutBtn" class="primary">
Save About
</button>

</section>


<!-- CONTACT -->

<section class="card">

<h2>Contact</h2>

<label>Email</label>
<input id="contactEmail" type="email">

<label>Phone / WhatsApp</label>
<input id="contactPhone">

<label>Instagram</label>
<input id="contactInstagram">

<button id="saveContactBtn" class="primary">
Save Contact
</button>

</section>


<!-- SERVICES -->

<section class="card">

<h2>Services</h2>

<input type="hidden" id="serviceEditIndex" value="-1">

<label>Service Title</label>
<input id="serviceTitle" placeholder="Video Editing">

<label>Service Description</label>
<textarea id="serviceDescription" placeholder="Service description..."></textarea>

<button id="saveServiceBtn" class="primary">
Add Service
</button>

<div id="servicesList"></div>

</section>


<!-- CONTENT -->

<section class="card">

<h2>Content</h2>

<input type="hidden" id="contentEditIndex" value="-1">

<label>Content Title</label>
<input id="contentTitle" placeholder="My Notes">

<label>Content Text</label>
<textarea id="contentText"></textarea>

<button id="saveContentBtn" class="primary">
Add Content
</button>

<div id="contentList"></div>

</section>


<!-- BULK MEDIA -->

<section class="card">

<h2>📁 Bulk Media Upload</h2>

<p class="small">
Select multiple photos, videos or PDFs and upload them together.
</p>

<label>Media Title Prefix</label>
<input
id="mediaTitle"
placeholder="Example: My Photos"
>

<label>Description</label>
<textarea
id="mediaDescription"
placeholder="Optional description..."
></textarea>

<label>Select Multiple Files</label>

<input
type="file"
id="mediaFiles"
multiple
accept="image/*,video/*,.pdf"
>

<button id="uploadMediaBtn" class="primary">
Upload All Files
</button>

<div id="uploadStatus" class="status">
Ready.
</div>

<div id="progressBox" class="progress-box"></div>

</section>


<!-- MEDIA LIST -->

<section class="card">

<h2>Uploaded Media</h2>

<div id="mediaList"></div>

</section>


<section class="card">

<h2>Website Data</h2>

<button id="reloadBtn" class="secondary">
Reload Data
</button>

<div id="saveStatus" class="status">
Ready.
</div>

</section>

</main>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyCqZVROZOMbmHA3-cXZ8ql5LFnKkTr9jzk",

authDomain:"primehub-12dde.firebaseapp.com",

projectId:"primehub-12dde",

storageBucket:"primehub-12dde.firebasestorage.app",

messagingSenderId:"1081645394839",

appId:"1:1081645394839:web:796cc1c3de6d1ce201b2d2",

measurementId:"G-878ZB4S1LP"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


const ADMIN_UID="7QhHlG0ydFcpFBXfs6w8fGJRK322";


/* CLOUDINARY */

const CLOUD_NAME="wmdqvk3v";

const UPLOAD_PRESET="primehub";


let siteData={
about:{title:"About Me",text:""},
contact:{email:"",phone:"",instagram:""},
services:[],
content:[],
media:[]
};


const loginSection=document.getElementById("loginSection");

const adminPanel=document.getElementById("adminPanel");

const loginStatus=document.getElementById("loginStatus");

const logoutBtn=document.getElementById("logoutBtn");


/* LOGIN */

document.getElementById("loginBtn").onclick=async()=>{

const email=document.getElementById("loginEmail").value.trim();

const password=document.getElementById("loginPassword").value;

if(!email||!password){

loginStatus.textContent="Enter email and password.";

return;
}

loginStatus.textContent="Logging in...";

try{

const result=await signInWithEmailAndPassword(
auth,
email,
password
);

if(result.user.uid!==ADMIN_UID){

await signOut(auth);

loginStatus.textContent="Not authorized.";

return;
}

loginStatus.textContent="Login successful.";

}catch(error){

loginStatus.textContent="Login failed: "+error.message;

}

};


/* AUTH */

onAuthStateChanged(auth,async user=>{

if(user&&user.uid===ADMIN_UID){

loginSection.classList.add("hidden");

adminPanel.classList.remove("hidden");

logoutBtn.classList.remove("hidden");

await loadData();

}else{

loginSection.classList.remove("hidden");

adminPanel.classList.add("hidden");

logoutBtn.classList.add("hidden");

}

});


/* LOGOUT */

logoutBtn.onclick=async()=>{

await signOut(auth);

location.reload();

};


/* LOAD */

async function loadData(){

try{

const snap=await getDoc(
doc(db,"siteData","main")
);

if(snap.exists()){

const d=snap.data();

siteData={

about:
typeof d.about==="object"
?d.about
:{title:"About Me",text:d.about||""},

contact:d.contact||{},

services:Array.isArray(d.services)
?d.services:[],

content:Array.isArray(d.content)
?d.content:[],

media:Array.isArray(d.media)
?d.media:[]

};

}

fillForms();

renderServices();

renderContent();

renderMedia();

document.getElementById("saveStatus").textContent=
"Data loaded successfully.";

}catch(error){

document.getElementById("saveStatus").textContent=
"Load failed: "+error.message;

}

}


/* SAVE */

async function saveData(){

try{

await setDoc(
doc(db,"siteData","main"),
siteData,
{merge:true}
);

document.getElementById("saveStatus").textContent=
"Saved successfully.";

}catch(error){

document.getElementById("saveStatus").textContent=
"Save failed: "+error.message;

}

}


/* FORMS */

function fillForms(){

document.getElementById("aboutTitle").value=
siteData.about?.title||"About Me";

document.getElementById("aboutText").value=
siteData.about?.text||"";

document.getElementById("contactEmail").value=
siteData.contact?.email||"";

document.getElementById("contactPhone").value=
siteData.contact?.phone||"";

document.getElementById("contactInstagram").value=
siteData.contact?.instagram||"";

}


/* ABOUT */

document.getElementById("saveAboutBtn").onclick=async()=>{

siteData.about={

title:document.getElementById("aboutTitle").value.trim(),

text:document.getElementById("aboutText").value.trim()

};

await saveData();

};


/* CONTACT */

document.getElementById("saveContactBtn").onclick=async()=>{

siteData.contact={

email:document.getElementById("contactEmail").value.trim(),

phone:document.getElementById("contactPhone").value.trim(),

instagram:document.getElementById("contactInstagram").value.trim()

};

await saveData();

};


/* SERVICES */

document.getElementById("saveServiceBtn").onclick=async()=>{

const title=document.getElementById("serviceTitle").value.trim();

const description=document.getElementById("serviceDescription").value.trim();

if(!title){

alert("Enter service title.");

return;

}

const index=Number(
document.getElementById("serviceEditIndex").value
);

const item={title,description};

if(index>=0){

siteData.services[index]=item;

}else{

siteData.services.push(item);

}

document.getElementById("serviceTitle").value="";

document.getElementById("serviceDescription").value="";

document.getElementById("serviceEditIndex").value="-1";

document.getElementById("saveServiceBtn").textContent="Add Service";

renderServices();

await saveData();

};


function renderServices(){

const box=document.getElementById("servicesList");

box.innerHTML="";

siteData.services.forEach((s,i)=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<div class="item-title">${esc(s.title)}</div>

<div>${esc(s.description||s.text||"")}</div>

<button class="secondary" data-edit-service="${i}">
Edit
</button>

<button class="danger" data-delete-service="${i}">
Delete
</button>

`;

box.appendChild(div);

});

document.querySelectorAll("[data-edit-service]").forEach(btn=>{

btn.onclick=()=>{

const i=Number(btn.dataset.editService);

const s=siteData.services[i];

document.getElementById("serviceTitle").value=s.title||"";

document.getElementById("serviceDescription").value=
s.description||s.text||"";

document.getElementById("serviceEditIndex").value=i;

document.getElementById("saveServiceBtn").textContent=
"Update Service";

};

});


document.querySelectorAll("[data-delete-service]").forEach(btn=>{

btn.onclick=async()=>{

const i=Number(btn.dataset.deleteService);

if(!confirm("Delete this service?"))return;

siteData.services.splice(i,1);

renderServices();

await saveData();

};

});

}


/* CONTENT */

document.getElementById("saveContentBtn").onclick=async()=>{

const title=document.getElementById("contentTitle").value.trim();

const text=document.getElementById("contentText").value.trim();

if(!title){

alert("Enter content title.");

return;

}

const index=Number(
document.getElementById("contentEditIndex").value
);

const item={title,text};

if(index>=0){

siteData.content[index]=item;

}else{

siteData.content.push(item);

}

document.getElementById("contentTitle").value="";

document.getElementById("contentText").value="";

document.getElementById("contentEditIndex").value="-1";

document.getElementById("saveContentBtn").textContent="Add Content";

renderContent();

await saveData();

};


function renderContent(){

const box=document.getElementById("contentList");

box.innerHTML="";

siteData.content.forEach((c,i)=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<div class="item-title">${esc(c.title)}</div>

<div>${esc(c.text||c.description||"")}</div>

<button class="secondary" data-edit-content="${i}">
Edit
</button>

<button class="danger" data-delete-content="${i}">
Delete
</button>

`;

box.appendChild(div);

});

document.querySelectorAll("[data-edit-content]").forEach(btn=>{

btn.onclick=()=>{

const i=Number(btn.dataset.editContent);

const c=siteData.content[i];

document.getElementById("contentTitle").value=c.title||"";

document.getElementById("contentText").value=
c.text||c.description||"";

document.getElementById("contentEditIndex").value=i;

document.getElementById("saveContentBtn").textContent=
"Update Content";

};

});


document.querySelectorAll("[data-delete-content]").forEach(btn=>{

btn.onclick=async()=>{

const i=Number(btn.dataset.deleteContent);

if(!confirm("Delete this content?"))return;

siteData.content.splice(i,1);

renderContent();

await saveData();

};

});

}


/* =========================================
   BULK UPLOAD
========================================= */

document.getElementById("uploadMediaBtn").onclick=async()=>{

const files=[
...document.getElementById("mediaFiles").files
];

if(!files.length){

alert("Please select files.");

return;

}

const prefix=
document.getElementById("mediaTitle").value.trim();

const description=
document.getElementById("mediaDescription").value.trim();

const status=
document.getElementById("uploadStatus");

const progressBox=
document.getElementById("progressBox");


progressBox.innerHTML="";

status.textContent=
`Starting ${files.length} upload(s)...`;


let completed=0;

let failed=0;


/*
  Upload maximum 3 files at a time.
  This makes bulk upload faster without
  sending everything simultaneously.
*/

const concurrency=3;


async function uploadOne(file,index){

const row=document.createElement("div");

row.className="progress-item";

row.innerHTML=`

<div class="progress-name">
${index+1}. ${esc(file.name)}
</div>

<div class="progress-bar">
<div class="progress-fill"></div>
</div>

<div class="progress-text">
Uploading...
</div>

`;

progressBox.appendChild(row);

const fill=row.querySelector(".progress-fill");

const text=row.querySelector(".progress-text");


try{

const result=awaitupload(file,(percent)=>{

fill.style.width=percent+"%";

text.textContent=
percent+"%";

});


const mediaItem={

title:
prefix
?`${prefix} ${index+1}`
:file.name,

description,

url:result.secure_url,

publicId:result.public_id,

resourceType:result.resource_type,

format:result.format||"",

createdAt:new Date().toISOString()

};


siteData.media.unshift(mediaItem);

completed++;

fill.style.width="100%";

text.textContent="✓ Uploaded";

}catch(error){

failed++;

text.textContent="✕ Failed: "+error.message;

}

}


/* worker queue */

let nextIndex=0;

async function worker(){

while(true){

const index=nextIndex++;

if(index>=files.length)break;

await uploadOne(files[index],index);

status.textContent=
`Uploaded ${completed}/${files.length} • Failed ${failed}`;

}

}


const workers=[];

for(let i=0;i<Math.min(concurrency,files.length);i++){

workers.push(worker());

}

await Promise.all(workers);


await saveData();

renderMedia();


document.getElementById("mediaFiles").value="";

status.textContent=
`Finished: ${completed} uploaded, ${failed} failed.`;

};


/* CLOUDINARY UPLOAD WITH PROGRESS */

function awaitupload(file,onProgress){

return new Promise((resolve,reject)=>{

const xhr=new XMLHttpRequest();

xhr.open(
"POST",
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`
);

xhr.upload.onprogress=e=>{

if(e.lengthComputable){

const percent=
Math.round(
(e.loaded/e.total)*100
);

onProgress(percent);

}

};

xhr.onload=()=>{

try{

const result=JSON.parse(xhr.responseText);

if(xhr.status>=200&&xhr.status<300){

resolve(result);

}else{

reject(
new Error(
result.error?.message||
"Upload failed"
)
);

}

}catch{

reject(
new Error("Invalid Cloudinary response")
);

}

};

xhr.onerror=()=>{

reject(
new Error("Network error")
);

};

const formData=new FormData();

formData.append("file",file);

formData.append(
"upload_preset",
UPLOAD_PRESET
);

xhr.send(formData);

});

}


/* MEDIA LIST */

function renderMedia(){

const box=document.getElementById("mediaList");

box.innerHTML="";

if(!siteData.media.length){

box.innerHTML=
`<div class="status">No media uploaded yet.</div>`;

return;

}

siteData.media.forEach((m,i)=>{

const div=document.createElement("div");

div.className="item";


let preview="";

if(m.resourceType==="image"){

preview=
`<img class="media-preview" src="${m.url}">`;

}else if(m.resourceType==="video"){

preview=
`<video class="media-preview" controls src="${m.url}"></video>`;

}else{

preview=
`<a
href="${m.url}"
target="_blank"
style="color:#d8b56a">
Open PDF / File
</a>`;

}


div.innerHTML=`

<div class="item-title">
${esc(m.title||"Untitled")}
</div>

<div>
${esc(m.description||"")}
</div>

${preview}

<button
class="danger"
data-delete-media="${i}">
Remove from Website
</button>

`;

box.appendChild(div);

});


document.querySelectorAll("[data-delete-media]").forEach(btn=>{

btn.onclick=async()=>{

const i=Number(btn.dataset.deleteMedia);

if(!confirm("Remove this media from website?"))return;

siteData.media.splice(i,1);

renderMedia();

await saveData();

};

});

}


/* RELOAD */

document.getElementById("reloadBtn").onclick=loadData;


/* ESCAPE */

function esc(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
</html>
