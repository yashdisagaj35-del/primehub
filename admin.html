<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PrimeHub Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#09090d;
  color:#fff;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:25px;
}

h1,h2,h3{margin-top:0}

.box{
  background:#14141b;
  border:1px solid #292933;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
}

input,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border-radius:9px;
  border:1px solid #33333f;
  background:#0d0d12;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
  background:#fff;
  color:#000;
  font-weight:bold;
  margin:4px;
}

button:hover{opacity:.85}

.danger{
  background:#d93636;
  color:#fff;
}

.secondary{
  background:#292933;
  color:#fff;
}

.edit{
  background:#44445a;
  color:#fff;
}

.hidden{display:none!important}

.status{
  padding:12px;
  border-radius:8px;
  background:#20202a;
  margin:10px 0;
}

.item{
  background:#0d0d12;
  border:1px solid #292933;
  border-radius:12px;
  padding:16px;
  margin:12px 0;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.media-preview{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
}

.logout{
  float:right;
}

small{
  color:#aaa;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

@media(max-width:600px){
  .wrap{padding:15px}
  .logout{
    float:none;
    margin-bottom:15px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<!-- ================= LOGIN ================= -->

<section id="loginBox" class="box">

<h1>PrimeHub Admin</h1>

<p>
<small>Private website management panel</small>
</p>

<input
id="email"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="password"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginBtn">
Login
</button>

<div id="loginStatus" class="status">
Please login.
</div>

</section>


<!-- ================= ADMIN ================= -->

<section id="adminBox" class="hidden">

<button id="logoutBtn" class="secondary logout">
Logout
</button>

<h1>PrimeHub Admin Panel</h1>

<div id="saveStatus" class="status">
Ready.
</div>


<!-- ================= ABOUT ================= -->

<div class="box">

<h2>About</h2>

<textarea
id="about"
placeholder="Write your About section..."
></textarea>

<button id="saveAboutBtn">
Save About
</button>

</div>


<!-- ================= SERVICES ================= -->

<div class="box">

<h2>Services</h2>

<input
id="serviceTitle"
placeholder="Service title"
>

<textarea
id="serviceText"
placeholder="Service description"
></textarea>

<button id="addServiceBtn">
Add Service
</button>

<div id="servicesList"></div>

</div>


<!-- ================= CONTENT ================= -->

<div class="box">

<h2>Content</h2>

<input
id="contentTitle"
placeholder="Content title"
>

<textarea
id="contentText"
placeholder="Content description"
></textarea>

<button id="addContentBtn">
Add Content
</button>

<div id="contentList"></div>

</div>


<!-- ================= CONTACT ================= -->

<div class="box">

<h2>Contact</h2>

<input
id="contactEmail"
type="email"
placeholder="Email"
>

<input
id="contactInstagram"
placeholder="Instagram"
>

<input
id="contactPhone"
placeholder="Phone"
>

<button id="saveContactBtn">
Save Contact
</button>

</div>


<!-- ================= MEDIA ================= -->

<div class="box">

<h2>Upload Media</h2>

<p>
<small>
Upload photos, videos or PDF documents.
</small>
</p>

<input
id="mediaTitle"
placeholder="File title"
>

<textarea
id="mediaDescription"
placeholder="File description"
></textarea>

<input
id="mediaFile"
type="file"
accept="image/*,video/*,.pdf"
>

<button id="uploadBtn">
Upload File
</button>

<div id="uploadStatus" class="status"></div>

</div>


<!-- ================= MEDIA LIST ================= -->

<div class="box">

<h2>Uploaded Media</h2>

<div
id="mediaList"
class="grid"
></div>

</div>

</section>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORTS
========================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBCx_8R-fGh9Ci4M-0Fk57dQnRfXe74YSY",

  authDomain:
    "primehub-12dde.firebaseapp.com",

  projectId:
    "primehub-12dde",

  storageBucket:
    "primehub-12dde.firebasestorage.app",

  messagingSenderId:
    "1081645394839",

  appId:
    "1:108164539483:web:796cc1c3de6d1ce201b2d2",

  measurementId:
    "G-878ZB4S1LP"
};


/* =========================================
   CLOUDINARY
========================================= */

const CLOUD_NAME = "wmdqvk3v";
const UPLOAD_PRESET = "primehub";


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
  "7QhHlG0ydFcpFBXfs6w8fGJRK322";


/* =========================================
   FIREBASE INITIALIZE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const dataRef =
  doc(db,"siteData","main");


/* =========================================
   DEFAULT DATA
========================================= */

const defaultData = {

  about:
    "Welcome to PrimeHub — my personal and business digital space.",

  services: [],

  content: [],

  contact:{
    email:"",
    instagram:"",
    phone:""
  },

  media:[]
};


let siteData = {};


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
  document.getElementById("loginBox");

const adminBox =
  document.getElementById("adminBox");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginStatus =
  document.getElementById("loginStatus");

const saveStatus =
  document.getElementById("saveStatus");


/* =========================================
   LOGIN
========================================= */

loginBtn.addEventListener(
"click",
async()=>{

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;

  if(!email || !password){

    loginStatus.textContent =
      "Enter email and password.";

    return;
  }

  loginStatus.textContent =
    "Logging in...";

  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    if(result.user.uid !== ADMIN_UID){

      await signOut(auth);

      loginStatus.textContent =
        "This account is not authorized.";

      return;
    }

    loginStatus.textContent =
      "Login successful.";

  }catch(error){

    console.error(error);

    loginStatus.textContent =
      "Login failed: "+error.message;
  }

});


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
auth,
async(user)=>{

  if(user && user.uid === ADMIN_UID){

    loginBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    await loadData();

  }else{

    loginBox.classList.remove("hidden");

    adminBox.classList.add("hidden");

  }

});


/* =========================================
   LOAD DATA
========================================= */

async function loadData(){

  try{

    const snapshot =
      await getDoc(dataRef);

    if(snapshot.exists()){

      siteData = {
        ...defaultData,
        ...snapshot.data()
      };

    }else{

      siteData = {
        ...defaultData
      };

      await saveData();
    }

    normalizeData();

    renderAll();

  }catch(error){

    console.error(error);

    saveStatus.textContent =
      "Failed to load data.";
  }

}


/* =========================================
   NORMALIZE
========================================= */

function normalizeData(){

  if(!Array.isArray(siteData.services))
    siteData.services=[];

  if(!Array.isArray(siteData.content))
    siteData.content=[];

  if(!Array.isArray(siteData.media))
    siteData.media=[];

  if(!siteData.contact)
    siteData.contact={
      email:"",
      instagram:"",
      phone:""
    };
}


/* =========================================
   SAVE DATA
========================================= */

async function saveData(){

  try{

    await setDoc(
      dataRef,
      siteData,
      {merge:true}
    );

    saveStatus.textContent =
      "✓ Saved successfully.";

  }catch(error){

    console.error(error);

    saveStatus.textContent =
      "Save failed: "+error.message;
  }

}


/* =========================================
   ABOUT
========================================= */

document
.getElementById("saveAboutBtn")
.addEventListener(
"click",
async()=>{

  siteData.about =
    document
    .getElementById("about")
    .value
    .trim();

  await saveData();

});


/* =========================================
   ADD SERVICE
========================================= */

document
.getElementById("addServiceBtn")
.addEventListener(
"click",
async()=>{

  const title =
    document
    .getElementById("serviceTitle")
    .value
    .trim();

  const text =
    document
    .getElementById("serviceText")
    .value
    .trim();

  if(!title){

    alert("Enter service title.");

    return;
  }

  siteData.services.push({
    title,
    text
  });

  document
  .getElementById("serviceTitle")
  .value="";

  document
  .getElementById("serviceText")
  .value="";

  await saveData();

  renderServices();

});


/* =========================================
   ADD CONTENT
========================================= */

document
.getElementById("addContentBtn")
.addEventListener(
"click",
async()=>{

  const title =
    document
    .getElementById("contentTitle")
    .value
    .trim();

  const text =
    document
    .getElementById("contentText")
    .value
    .trim();

  if(!title){

    alert("Enter content title.");

    return;
  }

  siteData.content.push({
    title,
    text
  });

  document
  .getElementById("contentTitle")
  .value="";

  document
  .getElementById("contentText")
  .value="";

  await saveData();

  renderContent();

});


/* =========================================
   CONTACT
========================================= */

document
.getElementById("saveContactBtn")
.addEventListener(
"click",
async()=>{

  siteData.contact={

    email:
      document
      .getElementById("contactEmail")
      .value
      .trim(),

    instagram:
      document
      .getElementById("contactInstagram")
      .value
      .trim(),

    phone:
      document
      .getElementById("contactPhone")
      .value
      .trim()

  };

  await saveData();

});


/* =========================================
   DELETE SERVICE
========================================= */

async function deleteService(index){

  if(!confirm(
    "Delete this service?"
  )) return;

  siteData.services.splice(
    index,
    1
  );

  await saveData();

  renderServices();

}


/* =========================================
   EDIT SERVICE
========================================= */

async function editService(index){

  const item =
    siteData.services[index];

  const title =
    prompt(
      "Service title:",
      item.title
    );

  if(title === null) return;

  const text =
    prompt(
      "Service description:",
      item.text
    );

  if(text === null) return;

  siteData.services[index]={
    title:title.trim(),
    text:text.trim()
  };

  await saveData();

  renderServices();

}


/* =========================================
   DELETE CONTENT
========================================= */

async function deleteContent(index){

  if(!confirm(
    "Delete this content?"
  )) return;

  siteData.content.splice(
    index,
    1
  );

  await saveData();

  renderContent();

}


/* =========================================
   EDIT CONTENT
========================================= */

async function editContent(index){

  const item =
    siteData.content[index];

  const title =
    prompt(
      "Content title:",
      item.title
    );

  if(title === null) return;

  const text =
    prompt(
      "Content description:",
      item.text
    );

  if(text === null) return;

  siteData.content[index]={
    title:title.trim(),
    text:text.trim()
  };

  await saveData();

  renderContent();

}


/* =========================================
   DELETE MEDIA FROM WEBSITE
========================================= */

async function deleteMedia(index){

  if(!confirm(
    "Remove this file from your website?"
  )) return;

  siteData.media.splice(
    index,
    1
  );

  await saveData();

  renderMedia();

}


/* =========================================
   EDIT MEDIA
========================================= */

async function editMedia(index){

  const item =
    siteData.media[index];

  const title =
    prompt(
      "File title:",
      item.title || ""
    );

  if(title === null) return;

  const description =
    prompt(
      "File description:",
      item.description || ""
    );

  if(description === null) return;

  siteData.media[index]={
    ...item,
    title:title.trim(),
    description:description.trim()
  };

  await saveData();

  renderMedia();

}


/* =========================================
   RENDER SERVICES
========================================= */

function renderServices(){

  const list =
    document.getElementById(
      "servicesList"
    );

  list.innerHTML="";

  if(!siteData.services.length){

    list.innerHTML =
      "<small>No services added.</small>";

    return;
  }

  siteData.services.forEach(
  (item,index)=>{

    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <h3>
        ${escapeHtml(item.title)}
      </h3>

      <p>
        ${escapeHtml(item.text)}
      </p>

      <div class="actions">

        <button
          class="edit"
          data-edit="${index}"
        >
          Edit
        </button>

        <button
          class="danger"
          data-delete="${index}"
        >
          Delete
        </button>

      </div>
    `;

    div
    .querySelector("[data-edit]")
    .addEventListener(
      "click",
      ()=>editService(index)
    );

    div
    .querySelector("[data-delete]")
    .addEventListener(
      "click",
      ()=>deleteService(index)
    );

    list.appendChild(div);

  });

}


/* =========================================
   RENDER CONTENT
========================================= */

function renderContent(){

  const list =
    document.getElementById(
      "contentList"
    );

  list.innerHTML="";

  if(!siteData.content.length){

    list.innerHTML =
      "<small>No content added.</small>";

    return;
  }

  siteData.content.forEach(
  (item,index)=>{

    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML=`

      <h3>
        ${escapeHtml(item.title)}
      </h3>

      <p>
        ${escapeHtml(item.text)}
      </p>

      <div class="actions">

        <button
          class="edit"
          data-edit="${index}"
        >
          Edit
        </button>

        <button
          class="danger"
          data-delete="${index}"
        >
          Delete
        </button>

      </div>
    `;

    div
    .querySelector("[data-edit]")
    .addEventListener(
      "click",
      ()=>editContent(index)
    );

    div
    .querySelector("[data-delete]")
    .addEventListener(
      "click",
      ()=>deleteContent(index)
    );

    list.appendChild(div);

  });

}


/* =========================================
   UPLOAD
========================================= */

document
.getElementById("uploadBtn")
.addEventListener(
"click",
async()=>{

  const file =
    document
    .getElementById("mediaFile")
    .files[0];

  const title =
    document
    .getElementById("mediaTitle")
    .value
    .trim();

  const description =
    document
    .getElementById("mediaDescription")
    .value
    .trim();

  const status =
    document
    .getElementById("uploadStatus");


  if(!file){

    status.textContent =
      "Please select a file.";

    return;
  }

  if(!title){

    status.textContent =
      "Please enter a title.";

    return;
  }


  status.textContent =
    "Uploading...";


  try{

    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "upload_preset",
      UPLOAD_PRESET
    );


    const response =
      await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
        {
          method:"POST",
          body:formData
        }
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result.error?.message ||
        "Upload failed."
      );

    }


    const mediaItem={

      title,

      description,

      url:
        result.secure_url,

      publicId:
        result.public_id,

      resourceType:
        result.resource_type,

      format:
        result.format || "",

      createdAt:
        new Date().toISOString()

    };


    siteData.media.push(
      mediaItem
    );


    await saveData();


    document
    .getElementById("mediaTitle")
    .value="";

    document
    .getElementById("mediaDescription")
    .value="";

    document
    .getElementById("mediaFile")
    .value="";


    status.textContent =
      "✓ Upload successful.";

    renderMedia();


  }catch(error){

    console.error(error);

    status.textContent =
      "Upload failed: "+
      error.message;

  }

});


/* =========================================
   RENDER MEDIA
========================================= */

function renderMedia(){

  const list =
    document.getElementById(
      "mediaList"
    );

  list.innerHTML="";


  if(!siteData.media.length){

    list.innerHTML =
      "<small>No uploaded media.</small>";

    return;
  }


  siteData.media.forEach(
  (item,index)=>{

    const div =
      document.createElement("div");

    div.className="item";


    let preview="";


    if(
      item.resourceType === "image"
    ){

      preview=`

        <img
          class="media-preview"
          src="${escapeHtml(item.url)}"
          alt="${escapeHtml(item.title)}"
        >

      `;

    }


    else if(
      item.resourceType === "video"
    ){

      preview=`

        <video
          class="media-preview"
          controls
        >

          <source
            src="${escapeHtml(item.url)}"
          >

        </video>

      `;

    }


    else{

      preview=`

        <div
          style="
            font-size:50px;
            text-align:center;
            padding:30px;
          "
        >
          📄
        </div>

      `;

    }


    div.innerHTML=`

      ${preview}

      <h3>
        ${escapeHtml(item.title)}
      </h3>

      <p>
        ${escapeHtml(
          item.description || ""
        )}
      </p>

      <div class="actions">

        <a
          href="${escapeHtml(item.url)}"
          target="_blank"
          rel="noopener"
        >
          <button>
            Open
          </button>
        </a>

        <button
          class="edit"
          data-edit="${index}"
        >
          Edit
        </button>

        <button
          class="danger"
          data-delete="${index}"
        >
          Remove
        </button>

      </div>

    `;


    div
    .querySelector("[data-edit]")
    .addEventListener(
      "click",
      ()=>editMedia(index)
    );


    div
    .querySelector("[data-delete]")
    .addEventListener(
      "click",
      ()=>deleteMedia(index)
    );


    list.appendChild(div);

  });

}


/* =========================================
   RENDER ALL
========================================= */

function renderAll(){

  document
  .getElementById("about")
  .value =
    siteData.about || "";


  document
  .getElementById("contactEmail")
  .value =
    siteData.contact.email || "";


  document
  .getElementById("contactInstagram")
  .value =
    siteData.contact.instagram || "";


  document
  .getElementById("contactPhone")
  .value =
    siteData.contact.phone || "";


  renderServices();

  renderContent();

  renderMedia();

}


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
"click",
async()=>{

  await signOut(auth);

});


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value ?? "")
  .replace(
    /[&<>"']/g,
    char=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[char])
  );

}

</script>

</body>
</html>
