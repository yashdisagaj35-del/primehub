<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Yash</title><link rel="stylesheet" href="style.css"><style>.panel{max-width:1000px;margin:auto;padding:60px 7%}.box{background:#12151c;border:1px solid #252a34;border-radius:18px;padding:22px;margin:18px 0}input,textarea{width:100%;margin:7px 0 14px;padding:12px;border-radius:10px;border:1px solid #303642;background:#0b0d12;color:#fff}button{border:0;border-radius:10px;padding:11px 16px;background:#7c5cff;color:#fff;font-weight:700;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{border:1px solid #292e38;padding:15px;border-radius:12px;margin:10px 0}.danger{background:#a33}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><header class="nav"><a class="brand" href="index.html">YASH<span>.</span></a><nav><a href="index.html">View Website</a></nav></header><main class="panel"><p class="eyebrow">ADMIN PANEL — DEMO</p><h1>Manage your website</h1><p class="muted">This first version saves changes in this browser. For true anywhere-access admin, connect a free database/storage service in the next step.</p>
<div class="box"><h2>About</h2><textarea id="about" rows="4"></textarea></div>
<div class="box"><h2>Services</h2><div id="services"></div><button onclick="addService()">+ Add service</button></div>
<div class="box"><h2>Content</h2><div id="content"></div><button onclick="addContent()">+ Add content</button></div>
<div class="box"><h2>Contact</h2><div class="row"><label>Email<input id="email"></label><label>Instagram<input id="instagram"></label></div><label>Phone<input id="phone"></label></div>
<button onclick="save()">Save changes</button> <button class="danger" onclick="resetData()">Reset demo</button>
</main><script>
const base={about:"This section can be changed from the Admin panel.",services:[{title:"Video Editing",text:"Professional short-form and video editing."},{title:"Creative Work",text:"Design, content and digital projects."},{title:"Business",text:"A space for your services and future business."}],content:[{title:"Notes & PDFs",text:"Add useful documents and resources."},{title:"Photos",text:"Showcase your images and projects."},{title:"Updates",text:"Publish new work, ideas and announcements."}],contact:{email:"your@email.com",instagram:"@yourusername",phone:"+91 XXXXX XXXXX"}};
let d=JSON.parse(localStorage.getItem("yashSiteData")||"null")||base;
function input(v){return String(v).replace(/"/g,"&quot;")}
function render(){about.value=d.about;email.value=d.contact.email;instagram.value=d.contact.instagram;phone.value=d.contact.phone;services.innerHTML=d.services.map((x,i)=>`<div class="item"><input value="${input(x.title)}" data-s="t" data-i="${i}"><textarea data-s="p" data-i="${i}">${x.text}</textarea><button class="danger" onclick="del('services',${i})">Delete</button></div>`).join("");content.innerHTML=d.content.map((x,i)=>`<div class="item"><input value="${input(x.title)}" data-c="t" data-i="${i}"><textarea data-c="p" data-i="${i}">${x.text}</textarea><button class="danger" onclick="del('content',${i})">Delete</button></div>`).join("")}
function collect(){d.about=about.value;d.contact={email:email.value,instagram:instagram.value,phone:phone.value};document.querySelectorAll("[data-s]").forEach(e=>{let i=e.dataset.i;if(e.dataset.s==="t")d.services[i].title=e.value;else d.services[i].text=e.value});document.querySelectorAll("[data-c]").forEach(e=>{let i=e.dataset.i;if(e.dataset.c==="t")d.content[i].title=e.value;else d.content[i].text=e.value})}
function save(){collect();localStorage.setItem("yashSiteData",JSON.stringify(d));alert("Saved on this browser.")}
function addService(){collect();d.services.push({title:"New service",text:"Describe this service."});render()}
function addContent(){collect();d.content.push({title:"New content",text:"Describe your content."});render()}
function del(k,i){collect();d[k].splice(i,1);render()}
function resetData(){localStorage.removeItem("yashSiteData");location.reload()}render();
</script></body></html>
