<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeHub Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0d;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: auto;
    }

    header {
      padding: 25px 0;
      border-bottom: 1px solid #29292d;
      margin-bottom: 30px;
    }

    header h1 {
      color: #d8b56a;
      margin-bottom: 6px;
    }

    header p {
      color: #999;
    }

    .card {
      background: #151518;
      border: 1px solid #29292d;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 22px;
    }

    h2 {
      color: #d8b56a;
      margin-bottom: 18px;
    }

    h3 {
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #ccc;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #0d0d0f;
      color: white;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #d8b56a;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
    }

    .primary {
      background: #d8b56a;
      color: #111;
    }

    .danger {
      background: #b33a3a;
      color: white;
    }

    .secondary {
      background: #29292d;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #202024;
      color: #ccc;
    }

    .item {
      background: #0e0e10;
      border: 1px solid #29292d;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .item-title {
      color: #d8b56a;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .media-preview {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-top: 10px;
      border-radius: 8px;
    }

    .logout {
      float: right;
    }

    .small {
      color: #888;
      font-size: 13px;
      margin-top: 7px;
    }

    @media(max-width:700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .logout {
        float: none;
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <button id="logoutBtn" class="secondary logout hidden">Logout</button>
    <h1>PrimeHub Admin</h1>
    <p>Manage your website content, contact details and media.</p>
  </header>


  <!-- LOGIN -->
  <section id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Enter password"
    >

    <button id="loginBtn" class="primary">
      Login
    </button>

    <div id="loginStatus" class="status">
      Please login.
    </div>

  </section>


  <!-- ADMIN PANEL -->
  <main id="adminPanel" class="hidden">


    <!-- ABOUT -->
    <section class="card">

      <h2>About</h2>

      <label>About Title</label>
      <input
        id="aboutTitle"
        placeholder="About me"
      >

      <label>About Text</label>
      <textarea
        id="aboutText"
        placeholder="Write your about section..."
      ></textarea>

      <button id="saveAboutBtn" class="primary">
        Save About
      </button>

    </section>


    <!-- CONTACT -->
    <section class="card">

      <h2>Contact</h2>

      <label>Email</label>
      <input
        id="contactEmail"
        type="email"
        placeholder="your@email.com"
      >

      <label>Phone / WhatsApp</label>
      <input
        id="contactPhone"
        placeholder="+91..."
      >

      <label>Instagram</label>
      <input
        id="contactInstagram"
        placeholder="https://instagram.com/..."
      >

      <button id="saveContactBtn" class="primary">
        Save Contact
      </button>

    </section>


    <!-- SERVICES -->
    <section class="card">

      <h2>Services</h2>

      <input type="hidden" id="serviceEditIndex" value="-1">

      <label>Service Title</label>
      <input
        id="serviceTitle"
        placeholder="Video Editing"
      >

      <label>Service Description</label>
      <textarea
        id="serviceDescription"
        placeholder="Describe your service..."
      ></textarea>

      <button id="saveServiceBtn" class="primary">
        Add Service
      </button>

      <div id="servicesList"></div>

    </section>


    <!-- CONTENT -->
    <section class="card">

      <h2>Content</h2>

      <input type="hidden" id="contentEditIndex" value="-1">

      <label>Content Title</label>
      <input
        id="contentTitle"
        placeholder="My Notes"
      >

      <label>Content Text</label>
      <textarea
        id="contentText"
        placeholder="Write content..."
      ></textarea>

      <button id="saveContentBtn" class="primary">
        Add Content
      </button>

      <div id="contentList"></div>

    </section>


    <!-- MEDIA -->
    <section class="card">

      <h2>Media Upload</h2>

      <p class="small">
        Upload photos, videos and PDF/notes using Cloudinary.
      </p>

      <label>Title</label>
      <input
        id="mediaTitle"
        placeholder="My Photo"
      >

      <label>Description</label>
      <textarea
        id="mediaDescription"
        placeholder="Media description..."
      ></textarea>

      <label>Select File</label>
      <input
        type="file"
        id="mediaFile"
        accept="image/*,video/*,.pdf"
      >

      <button id="uploadMediaBtn" class="primary">
        Upload Media
      </button>

      <div id="uploadStatus" class="status">
        Ready to upload.
      </div>

      <div id="mediaList"></div>

    </section>


    <!-- SAVE ALL -->
    <section class="card">

      <h2>Website Data</h2>

      <button id="reloadBtn" class="secondary">
        Reload Data
      </button>

      <div id="saveStatus" class="status">
        Firebase connected.
      </div>

    </section>

  </main>

</div>


<script type="module">

  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyCqZVROZOMbmHA3-cXZ8ql5LFnKkTr9jzk",

    authDomain: "primehub-12dde.firebaseapp.com",

    projectId: "primehub-12dde",

    storageBucket: "primehub-12dde.firebasestorage.app",

    messagingSenderId: "1081645394839",

    appId: "1:1081645394839:web:796cc1c3de6d1ce201b2d2",

    measurementId: "G-878ZB4S1LP"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =========================================
     ADMIN UID
  ========================================= */

  const ADMIN_UID =
    "7QhHlG0ydFcpFBXfs6w8fGJRK322";


  /* =========================================
     CLOUDINARY
  ========================================= */

  const CLOUD_NAME = "wmdqvk3v";

  const UPLOAD_PRESET = "primehub";


  /* =========================================
     DEFAULT DATA
  ========================================= */

  let siteData = {

    about: {
      title: "About Me",
      text: ""
    },

    contact: {
      email: "",
      phone: "",
      instagram: ""
    },

    services: [],

    content: [],

    media: []

  };


  /* =========================================
     ELEMENTS
  ========================================= */

  const loginSection =
    document.getElementById("loginSection");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginStatus =
    document.getElementById("loginStatus");

  const logoutBtn =
    document.getElementById("logoutBtn");


  /* =========================================
     LOGIN
  ========================================= */

  document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      if (!email || !password) {

        loginStatus.textContent =
          "Please enter email and password.";

        return;
      }


      loginStatus.textContent =
        "Logging in...";


      try {

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        if (result.user.uid !== ADMIN_UID) {

          await signOut(auth);

          loginStatus.textContent =
            "This account is not authorized as admin.";

          return;
        }


        loginStatus.textContent =
          "Login successful.";

      }

      catch (error) {

        console.error(error);

        loginStatus.textContent =
          "Login failed: " + error.message;

      }

    });


  /* =========================================
     AUTH STATE
  ========================================= */

  onAuthStateChanged(auth, async (user) => {

    if (user && user.uid === ADMIN_UID) {

      loginSection.classList.add("hidden");

      adminPanel.classList.remove("hidden");

      logoutBtn.classList.remove("hidden");

      await loadData();

    }

    else {

      loginSection.classList.remove("hidden");

      adminPanel.classList.add("hidden");

      logoutBtn.classList.add("hidden");

    }

  });


  /* =========================================
     LOGOUT
  ========================================= */

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

    location.reload();

  });


  /* =========================================
     LOAD DATA
  ========================================= */

  async function loadData() {

    try {

      const ref =
        doc(db, "siteData", "main");

      const snap =
        await getDoc(ref);


      if (snap.exists()) {

        const data = snap.data();

        siteData = {

          about:
            typeof data.about === "object"
              ? data.about
              : {
                  title: "About Me",
                  text: data.about || ""
                },

          contact:
            data.contact || {},

          services:
            Array.isArray(data.services)
              ? data.services
              : [],

          content:
            Array.isArray(data.content)
              ? data.content
              : [],

          media:
            Array.isArray(data.media)
              ? data.media
              : []

        };

      }


      fillForms();

      renderServices();

      renderContent();

      renderMedia();

      document.getElementById("saveStatus")
        .textContent =
        "Data loaded successfully.";

    }

    catch (error) {

      console.error(error);

      document.getElementById("saveStatus")
        .textContent =
        "Load failed: " + error.message;

    }

  }


  /* =========================================
     FILL FORMS
  ========================================= */

  function fillForms() {

    document.getElementById("aboutTitle").value =
      siteData.about?.title || "About Me";

    document.getElementById("aboutText").value =
      siteData.about?.text || "";


    document.getElementById("contactEmail").value =
      siteData.contact?.email || "";

    document.getElementById("contactPhone").value =
      siteData.contact?.phone || "";

    document.getElementById("contactInstagram").value =
      siteData.contact?.instagram || "";

  }


  /* =========================================
     SAVE DATA
  ========================================= */

  async function saveData() {

    try {

      await setDoc(
        doc(db, "siteData", "main"),
        siteData,
        { merge: true }
      );


      document.getElementById("saveStatus")
        .textContent =
        "Saved successfully.";

    }

    catch (error) {

      console.error(error);

      document.getElementById("saveStatus")
        .textContent =
        "Save failed: " + error.message;

    }

  }


  /* =========================================
     ABOUT
  ========================================= */

  document
    .getElementById("saveAboutBtn")
    .addEventListener("click", async () => {

      siteData.about = {

        title:
          document
            .getElementById("aboutTitle")
            .value
            .trim(),

        text:
          document
            .getElementById("aboutText")
            .value
            .trim()

      };


      await saveData();

    });


  /* =========================================
     CONTACT
  ========================================= */

  document
    .getElementById("saveContactBtn")
    .addEventListener("click", async () => {

      siteData.contact = {

        email:
          document
            .getElementById("contactEmail")
            .value
            .trim(),

        phone:
          document
            .getElementById("contactPhone")
            .value
            .trim(),

        instagram:
          document
            .getElementById("contactInstagram")
            .value
            .trim()

      };


      await saveData();

    });


  /* =========================================
     SERVICES
  ========================================= */

  document
    .getElementById("saveServiceBtn")
    .addEventListener("click", async () => {

      const title =
        document
          .getElementById("serviceTitle")
          .value
          .trim();

      const description =
        document
          .getElementById("serviceDescription")
          .value
          .trim();

      if (!title) {

        alert("Please enter service title.");

        return;

      }


      const index =
        Number(
          document
            .getElementById("serviceEditIndex")
            .value
        );


      const item = {

        title,

        description

      };


      if (index >= 0) {

        siteData.services[index] =
          item;

      }

      else {

        siteData.services.push(item);

      }


      document.getElementById("serviceTitle").value = "";

      document.getElementById("serviceDescription").value = "";

      document.getElementById("serviceEditIndex").value = "-1";

      document.getElementById("saveServiceBtn")
        .textContent =
        "Add Service";


      renderServices();

      await saveData();

    });


  function renderServices() {

    const box =
      document.getElementById("servicesList");

    box.innerHTML = "";


    siteData.services.forEach((service, index) => {

      const div =
        document.createElement("div");

      div.className = "item";


      div.innerHTML = `

        <div class="item-title">
          ${escapeHtml(service.title || "")}
        </div>

        <div>
          ${escapeHtml(
            service.description ||
            service.text ||
            ""
          )}
        </div>

        <button
          class="secondary edit-service"
          data-index="${index}">
          Edit
        </button>

        <button
          class="danger delete-service"
          data-index="${index}">
          Delete
        </button>

      `;


      box.appendChild(div);

    });


    document
      .querySelectorAll(".edit-service")
      .forEach(btn => {

        btn.addEventListener("click", () => {

          const index =
            Number(btn.dataset.index);

          const item =
            siteData.services[index];


          document
            .getElementById("serviceTitle")
            .value =
            item.title || "";


          document
            .getElementById("serviceDescription")
            .value =
            item.description ||
            item.text ||
            "";


          document
            .getElementById("serviceEditIndex")
            .value =
            index;


          document
            .getElementById("saveServiceBtn")
            .textContent =
            "Update Service";

          window.scrollTo({
            top:
              document
                .getElementById("serviceTitle")
                .getBoundingClientRect()
                .top +
              window.scrollY -
              100,

            behavior: "smooth"
          });

        });

      });


    document
      .querySelectorAll(".delete-service")
      .forEach(btn => {

        btn.addEventListener("click", async () => {

          const index =
            Number(btn.dataset.index);


          if (
            !confirm(
              "Delete this service?"
            )
          ) return;


          siteData.services.splice(
            index,
            1
          );


          renderServices();

          await saveData();

        });

      });

  }


  /* =========================================
     CONTENT
  ========================================= */

  document
    .getElementById("saveContentBtn")
    .addEventListener("click", async () => {

      const title =
        document
          .getElementById("contentTitle")
          .value
          .trim();

      const text =
        document
          .getElementById("contentText")
          .value
          .trim();


      if (!title) {

        alert("Please enter content title.");

        return;

      }


      const index =
        Number(
          document
            .getElementById("contentEditIndex")
            .value
        );


      const item = {

        title,

        text

      };


      if (index >= 0) {

        siteData.content[index] =
          item;

      }

      else {

        siteData.content.push(item);

      }


      document.getElementById("contentTitle").value = "";

      document.getElementById("contentText").value = "";

      document.getElementById("contentEditIndex").value = "-1";

      document.getElementById("saveContentBtn")
        .textContent =
        "Add Content";


      renderContent();

      await saveData();

    });


  function renderContent() {

    const box =
      document.getElementById("contentList");

    box.innerHTML = "";


    siteData.content.forEach((item, index) => {

      const div =
        document.createElement("div");

      div.className = "item";


      div.innerHTML = `

        <div class="item-title">
          ${escapeHtml(item.title || "")}
        </div>

        <div>
          ${escapeHtml(
            item.text ||
            item.description ||
            ""
          )}
        </div>

        <button
          class="secondary edit-content"
          data-index="${index}">
          Edit
        </button>

        <button
          class="danger delete-content"
          data-index="${index}">
          Delete
        </button>

      `;


      box.appendChild(div);

    });


    document
      .querySelectorAll(".edit-content")
      .forEach(btn => {

        btn.addEventListener("click", () => {

          const index =
            Number(btn.dataset.index);

          const item =
            siteData.content[index];


          document
            .getElementById("contentTitle")
            .value =
            item.title || "";


          document
            .getElementById("contentText")
            .value =
            item.text ||
            item.description ||
            "";


          document
            .getElementById("contentEditIndex")
            .value =
            index;


          document
            .getElementById("saveContentBtn")
            .textContent =
            "Update Content";

        });

      });


    document
      .querySelectorAll(".delete-content")
      .forEach(btn => {

        btn.addEventListener("click", async () => {

          const index =
            Number(btn.dataset.index);


          if (
            !confirm(
              "Delete this content?"
            )
          ) return;


          siteData.content.splice(
            index,
            1
          );


          renderContent();

          await saveData();

        });

      });

  }


  /* =========================================
     CLOUDINARY UPLOAD
  ========================================= */

  document
    .getElementById("uploadMediaBtn")
    .addEventListener("click", async () => {

      const file =
        document
          .getElementById("mediaFile")
          .files[0];

      const title =
        document
          .getElementById("mediaTitle")
          .value
          .trim();

      const description =
        document
          .getElementById("mediaDescription")
          .value
          .trim();


      if (!file) {

        alert("Please select a file.");

        return;

      }


      const status =
        document.getElementById(
          "uploadStatus"
        );


      status.textContent =
        "Uploading...";


      try {

        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );

        formData.append(
          "upload_preset",
          UPLOAD_PRESET
        );


        const response =
          await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
            {
              method: "POST",
              body: formData
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error?.message ||
            "Cloudinary upload failed."
          );

        }


        const mediaItem = {

          title:
            title ||
            file.name,

          description,

          url:
            result.secure_url,

          publicId:
            result.public_id,

          resourceType:
            result.resource_type,

          format:
            result.format || "",

          createdAt:
            new Date().toISOString()

        };


        siteData.media =
          Array.isArray(siteData.media)
            ? siteData.media
            : [];


        siteData.media.unshift(
          mediaItem
        );


        await saveData();


        document
          .getElementById("mediaTitle")
          .value = "";

        document
          .getElementById("mediaDescription")
          .value = "";

        document
          .getElementById("mediaFile")
          .value = "";


        renderMedia();


        status.textContent =
          "Upload successful.";

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Upload failed: " +
          error.message;

      }

    });


  /* =========================================
     MEDIA LIST
  ========================================= */

  function renderMedia() {

    const box =
      document.getElementById("mediaList");

    box.innerHTML = "";


    siteData.media.forEach((item, index) => {

      const div =
        document.createElement("div");

      div.className = "item";


      let preview = "";


      if (
        item.resourceType === "image"
      ) {

        preview =
          `<img
            class="media-preview"
            src="${item.url}"
            alt=""
          >`;

      }

      else if (
        item.resourceType === "video"
      ) {

        preview =
          `<video
            class="media-preview"
            controls
            src="${item.url}">
          </video>`;

      }

      else {

        preview =
          `<a
            href="${item.url}"
            target="_blank"
            style="color:#d8b56a;">
            Open PDF / File
          </a>`;

      }


      div.innerHTML = `

        <div class="item-title">
          ${escapeHtml(
            item.title || "Untitled"
          )}
        </div>

        <div>
          ${escapeHtml(
            item.description || ""
          )}
        </div>

        ${preview}

        <button
          class="danger delete-media"
          data-index="${index}">
          Remove from Website
        </button>

      `;


      box.appendChild(div);

    });


    document
      .querySelectorAll(".delete-media")
      .forEach(btn => {

        btn.addEventListener("click", async () => {

          const index =
            Number(btn.dataset.index);


          if (
            !confirm(
              "Remove this media from website?"
            )
          ) return;


          siteData.media.splice(
            index,
            1
          );


          renderMedia();

          await saveData();

        });

      });

  }


  /* =========================================
     RELOAD
  ========================================= */

  document
    .getElementById("reloadBtn")
    .addEventListener(
      "click",
      loadData
    );


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
