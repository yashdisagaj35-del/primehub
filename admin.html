<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — PrimeHub</title>
<link rel="stylesheet" href="style.css">

<style>
.admin-wrap{
  max-width:1000px;
  margin:auto;
  padding:60px 7%;
}

.admin-box{
  background:#12151c;
  border:1px solid #252a34;
  border-radius:18px;
  padding:25px;
  margin:20px 0;
}

input,textarea,select{
  width:100%;
  box-sizing:border-box;
  margin:7px 0 14px;
  padding:13px;
  border-radius:10px;
  border:1px solid #303642;
  background:#0b0d12;
  color:#fff;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  background:#7c5cff;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.danger{
  background:#a33;
}

.logout{
  float:right;
  background:#333;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.item{
  border:1px solid #292e38;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.hidden{
  display:none;
}

.status{
  margin:15px 0;
  padding:12px;
  border-radius:10px;
  background:#171b24;
}

.file-info{
  font-size:13px;
  color:#aaa;
  margin:5px 0 15px;
}

@media(max-width:700px){
  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="nav">
  <a class="brand" href="index.html">PRIME<span>HUB.</span></a>

  <nav>
    <a href="index.html">View Website</a>
  </nav>
</header>

<main class="admin-wrap">

<!-- LOGIN -->

<section id="loginBox" class="admin-box">

  <p class="eyebrow">PRIMEHUB ADMIN</p>

  <h1>Admin Login</h1>

  <p class="muted">
    Login with your Firebase admin account.
  </p>

  <label>Email</label>

  <input
    id="loginEmail"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="loginPassword"
    type="password"
    placeholder="Password"
  >

  <button id="loginBtn">
    Login
  </button>

  <div id="loginStatus" class="status hidden"></div>

</section>


<!-- ADMIN -->

<section id="adminPanel" class="hidden">

  <div class="admin-box">

    <button id="logoutBtn" class="logout">
      Logout
    </button>

    <p class="eyebrow">
      ADMIN PANEL
    </p>

    <h1>
      Manage PrimeHub
    </h1>

    <p class="muted">
      Manage your website content from here.
    </p>

    <div id="saveStatus" class="status">
      Ready.
    </div>

  </div>


  <!-- ABOUT -->

  <div class="admin-box">

    <h2>About</h2>

    <textarea
      id="about"
      rows="5"
    ></textarea>

  </div>


  <!-- SERVICES -->

  <div class="admin-box">

    <h2>Services</h2>

    <div id="services"></div>

    <button id="addServiceBtn">
      + Add Service
    </button>

  </div>


  <!-- CONTENT -->

  <div class="admin-box">

    <h2>Content</h2>

    <div id="content"></div>

    <button id="addContentBtn">
      + Add Content
    </button>

  </div>


  <!-- FILE UPLOAD -->

  <div class="admin-box">

    <p class="eyebrow">
      MEDIA
    </p>

    <h2>
      Upload Photo / Video / PDF
    </h2>

    <label>
      Title
    </label>

    <input
      id="fileTitle"
      type="text"
      placeholder="Example: My New Video"
    >

    <label>
      Description
    </label>

    <textarea
      id="fileDescription"
      rows="3"
      placeholder="Short description"
    ></textarea>

    <label>
      Select File
    </label>

    <input
      id="mediaFile"
      type="file"
      accept="image/*,video/*,.pdf"
    >

    <div id="fileInfo" class="file-info">
      No file selected.
    </div>

    <button id="uploadBtn">
      Upload File
    </button>

    <div id="uploadStatus" class="status">
      Ready for upload.
    </div>

  </div>


  <!-- CONTACT -->

  <div class="admin-box">

    <h2>
      Contact
    </h2>

    <div class="row">

      <label>
        Email

        <input
          id="email"
          type="email"
        >

      </label>


      <label>
        Instagram

        <input
          id="instagram"
          type="text"
        >

      </label>

    </div>


    <label>
      Phone

      <input
        id="phone"
        type="text"
      >

    </label>

  </div>


  <button id="saveBtn">
    Save Changes
  </button>

</section>

</main>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}

from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  arrayUnion
}

from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBCx8R-fGh9Ci4M-0Fk57dQnRfXe74YSY",

  authDomain:
    "primehub-12dde.firebaseapp.com",

  projectId:
    "primehub-12dde",

  storageBucket:
    "primehub-12dde.firebasestorage.app",

  messagingSenderId:
    "1081645394839",

  appId:
    "1:1081645394839:web:796cc1c3de6d1ce201b2d2",

  measurementId:
    "G-878ZB4S1LP"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const CLOUD_NAME =
  "wmdqvk3v";

const UPLOAD_PRESET =
  "primehub";


const defaultData = {

  about:
    "Welcome to PrimeHub — my personal and business digital space.",

  services: [

    {
      title:"Video Editing",
      text:"Professional short-form and video editing."
    },

    {
      title:"Creative Work",
      text:"Design, content and digital projects."
    },

    {
      title:"Business",
      text:"A space for services and future business ideas."
    }

  ],

  content: [

    {
      title:"Notes & PDFs",
      text:"Useful documents and resources."
    },

    {
      title:"Photos",
      text:"Showcase images and projects."
    },

    {
      title:"Updates",
      text:"New work, ideas and announcements."
    }

  ],

  media: [],

  contact: {

    email:"your@email.com",

    instagram:"@yourusername",

    phone:"+91 XXXXX XXXXX"

  }

};


let data =
  structuredClone(defaultData);


const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const loginBtn =
  document.getElementById("loginBtn");

const loginStatus =
  document.getElementById("loginStatus");

const about =
  document.getElementById("about");

const services =
  document.getElementById("services");

const content =
  document.getElementById("content");

const email =
  document.getElementById("email");

const instagram =
  document.getElementById("instagram");

const phone =
  document.getElementById("phone");

const saveBtn =
  document.getElementById("saveBtn");

const saveStatus =
  document.getElementById("saveStatus");

const addServiceBtn =
  document.getElementById("addServiceBtn");

const addContentBtn =
  document.getElementById("addContentBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const fileTitle =
  document.getElementById("fileTitle");

const fileDescription =
  document.getElementById("fileDescription");

const mediaFile =
  document.getElementById("mediaFile");

const fileInfo =
  document.getElementById("fileInfo");

const uploadBtn =
  document.getElementById("uploadBtn");

const uploadStatus =
  document.getElementById("uploadStatus");


function showLoginStatus(message){

  loginStatus.textContent =
    message;

  loginStatus.classList.remove(
    "hidden"
  );

}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m]));

}


function render(){

  about.value =
    data.about || "";


  email.value =
    data.contact?.email || "";


  instagram.value =
    data.contact?.instagram || "";


  phone.value =
    data.contact?.phone || "";


  services.innerHTML =
    (data.services || [])
    .map((item,index)=>`

      <div class="item">

        <label>
          Service title
        </label>

        <input
          value="${esc(item.title)}"
          data-service-title="${index}"
        >

        <label>
          Service description
        </label>

        <textarea
          rows="3"
          data-service-text="${index}"
        >${esc(item.text)}</textarea>

        <button
          class="danger"
          data-delete-service="${index}"
        >
          Delete
        </button>

      </div>

    `)
    .join("");


  content.innerHTML =
    (data.content || [])
    .map((item,index)=>`

      <div class="item">

        <label>
          Content title
        </label>

        <input
          value="${esc(item.title)}"
          data-content-title="${index}"
        >

        <label>
          Content description
        </label>

        <textarea
          rows="3"
          data-content-text="${index}"
        >${esc(item.text)}</textarea>

        <button
          class="danger"
          data-delete-content="${index}"
        >
          Delete
        </button>

      </div>

    `)
    .join("");

}


function collect(){

  data.about =
    about.value;


  data.contact = {

    email:
      email.value,

    instagram:
      instagram.value,

    phone:
      phone.value

  };


  document
    .querySelectorAll(
      "[data-service-title]"
    )
    .forEach(el=>{

      const i =
        Number(
          el.dataset.serviceTitle
        );

      data.services[i].title =
        el.value;

    });


  document
    .querySelectorAll(
      "[data-service-text]"
    )
    .forEach(el=>{

      const i =
        Number(
          el.dataset.serviceText
        );

      data.services[i].text =
        el.value;

    });


  document
    .querySelectorAll(
      "[data-content-title]"
    )
    .forEach(el=>{

      const i =
        Number(
          el.dataset.contentTitle
        );

      data.content[i].title =
        el.value;

    });


  document
    .querySelectorAll(
      "[data-content-text]"
    )
    .forEach(el=>{

      const i =
        Number(
          el.dataset.contentText
        );

      data.content[i].text =
        el.value;

    });

}


async function loadData(){

  try{

    const ref =
      doc(
        db,
        "siteData",
        "main"
      );


    const snap =
      await getDoc(ref);


    if(snap.exists()){

      data = {

        ...structuredClone(
          defaultData
        ),

        ...snap.data()

      };

    }


    if(!Array.isArray(data.media)){

      data.media = [];

    }


    render();


    saveStatus.textContent =
      "✓ Data loaded from Firebase.";

  }

  catch(error){

    console.error(error);

    saveStatus.textContent =
      "Firebase read error: "
      + error.message;

  }

}


async function saveData(){

  collect();

  saveBtn.disabled =
    true;

  saveStatus.textContent =
    "Saving...";


  try{

    const ref =
      doc(
        db,
        "siteData",
        "main"
      );


    await setDoc(
      ref,
      data
    );


    saveStatus.textContent =
      "✓ Saved successfully to Firebase.";

  }

  catch(error){

    console.error(error);

    saveStatus.textContent =
      "Save error: "
      + error.message;

  }


  finally{

    saveBtn.disabled =
      false;

  }

}


loginBtn.addEventListener(
  "click",
  async()=>{

    const userEmail =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    if(
      !userEmail ||
      !password
    ){

      showLoginStatus(
        "Email and password required."
      );

      return;

    }


    loginBtn.disabled =
      true;


    showLoginStatus(
      "Logging in..."
    );


    try{

      await signInWithEmailAndPassword(
        auth,
        userEmail,
        password
      );


      showLoginStatus(
        "Login successful."
      );

    }

    catch(error){

      console.error(error);

      showLoginStatus(
        "Login failed: "
        + error.message
      );

    }


    finally{

      loginBtn.disabled =
        false;

    }

  }
);


logoutBtn.addEventListener(
  "click",
  ()=>{

    signOut(auth);

  }
);


saveBtn.addEventListener(
  "click",
  saveData
);


addServiceBtn.addEventListener(
  "click",
  ()=>{

    collect();


    data.services.push({

      title:
        "New Service",

      text:
        "Describe your service."

    });


    render();

  }
);


addContentBtn.addEventListener(
  "click",
  ()=>{

    collect();


    data.content.push({

      title:
        "New Content",

      text:
        "Describe your content."

    });


    render();

  }
);


mediaFile.addEventListener(
  "change",
  ()=>{

    const file =
      mediaFile.files[0];


    if(!file){

      fileInfo.textContent =
        "No file selected.";

      return;

    }


    const size =
      (
        file.size /
        (1024*1024)
      ).toFixed(2);


    fileInfo.textContent =
      `${file.name} • ${size} MB`;

  }
);


uploadBtn.addEventListener(
  "click",
  async()=>{

    const file =
      mediaFile.files[0];


    if(!file){

      uploadStatus.textContent =
        "Please select a file.";

      return;

    }


    const title =
      fileTitle.value.trim()
      || file.name;


    const description =
      fileDescription.value.trim();


    uploadBtn.disabled =
      true;


    uploadStatus.textContent =
      "Uploading...";


    try{

      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        UPLOAD_PRESET
      );


      const resourceType =
        file.type.startsWith("image/")
          ? "image"
          : file.type.startsWith("video/")
            ? "video"
            : "raw";


      const response =
        await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`,
          {
            method:"POST",
            body:formData
          }
        );


      const result =
        await response.json();


      if(!response.ok){

        throw new Error(
          result.error?.message
          || "Upload failed."
        );

      }


      const mediaItem = {

        id:
          crypto.randomUUID(),

        title:
          title,

        description:
          description,

        name:
          file.name,

        type:
          file.type,

        url:
          result.secure_url,

        publicId:
          result.public_id,

        createdAt:
          new Date().toISOString()

      };


      if(!Array.isArray(data.media)){

        data.media = [];

      }


      data.media.unshift(
        mediaItem
      );


      await setDoc(
        doc(
          db,
          "siteData",
          "main"
        ),
        data
      );


      fileTitle.value =
        "";

      fileDescription.value =
        "";

      mediaFile.value =
        "";

      fileInfo.textContent =
        "No file selected.";


      uploadStatus.textContent =
        "✓ File uploaded successfully.";


    }

    catch(error){

      console.error(error);

      uploadStatus.textContent =
        "Upload error: "
        + error.message;

    }


    finally{

      uploadBtn.disabled =
        false;

    }

  }
);


document.addEventListener(
  "click",
  event=>{

    if(
      event.target.dataset
      .deleteService
      !== undefined
    ){

      collect();

      const index =
        Number(
          event.target.dataset
          .deleteService
        );


      data.services.splice(
        index,
        1
      );


      render();

    }


    if(
      event.target.dataset
      .deleteContent
      !== undefined
    ){

      collect();

      const index =
        Number(
          event.target.dataset
          .deleteContent
        );


      data.content.splice(
        index,
        1
      );


      render();

    }

  }
);


onAuthStateChanged(
  auth,
  async(user)=>{

    if(user){

      loginBox.classList.add(
        "hidden"
      );


      adminPanel.classList.remove(
        "hidden"
      );


      await loadData();

    }

    else{

      loginBox.classList.remove(
        "hidden"
      );


      adminPanel.classList.add(
        "hidden"
      );

    }

  }
);

</script>

</body>
</html>
